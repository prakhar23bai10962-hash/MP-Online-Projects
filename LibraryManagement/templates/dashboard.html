{% extends "layout.html" %}

{% block content %}
<div class="container-fluid mt-3">
    <h2 class="mb-4">Dashboard</h2>
    
    <div class="row">
        <!-- Total Books -->
        <div class="col-md-3 mb-4">
            <div class="card text-white bg-primary shadow-sm h-100" style="border: none; border-radius: 4px;">
                <div class="card-body">
                    <h5 class="card-title" style="font-weight: 500; font-size: 1.1rem;">Total Books</h5>
                    <p class="card-text display-6" style="margin-top: 15px;">{{ total_books }}</p>
                </div>
            </div>
        </div>
        
        <!-- Total Students -->
        <div class="col-md-3 mb-4">
            <div class="card text-white bg-success shadow-sm h-100" style="border: none; border-radius: 4px;">
                <div class="card-body">
                    <h5 class="card-title" style="font-weight: 500; font-size: 1.1rem;">Total Students</h5>
                    <p class="card-text display-6" style="margin-top: 15px;">{{ total_students }}</p>
                </div>
            </div>
        </div>
        
        <!-- Total Librarians -->
        <div class="col-md-3 mb-4">
            <div class="card bg-warning text-dark shadow-sm h-100" style="border: none; border-radius: 4px;">
                <div class="card-body">
                    <h5 class="card-title" style="font-weight: 500; font-size: 1.1rem;">Total Librarians</h5>
                    <p class="card-text display-6" style="margin-top: 15px;">{{ total_librarians }}</p>
                </div>
            </div>
        </div>

        <!-- Total Borrow Records -->
        <div class="col-md-3 mb-4">
            <div class="card text-white bg-danger shadow-sm h-100" style="border: none; border-radius: 4px;">
                <div class="card-body">
                    <h5 class="card-title" style="font-weight: 500; font-size: 1.1rem;">Total Borrow Records</h5>
                    <p class="card-text display-6" style="margin-top: 15px;">{{ total_borrow_records }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
