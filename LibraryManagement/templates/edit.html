{% extends "layout.html" %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi bi-pencil-square"></i> Edit Book
                    </h4>
                </div>
                <div class="card-body">
                    <form action="{{ url_for('edit_book', id=book.id) }}" method="post" class="needs-validation">
                        <div class="mb-3">
                            <label for="Title" class="form-label">Title</label>
                            <input type="text" name="Title" id="Title" class="form-control" value="{{ book.title }}" required />
                        </div>
                        <div class="mb-3">
                            <label for="Author" class="form-label">Author</label>
                            <input type="text" name="Author" id="Author" class="form-control" value="{{ book.author }}" required />
                        </div>
                        <div class="mb-3">
                            <label for="Rating" class="form-label">Rating</label>
                            <input type="text" name="Rating" id="Rating" class="form-control" value="{{ book.rating }}" required />
                        </div>
                        <div class="mb-4">
                            <label for="PublishedDate" class="form-label">Published Date</label>
                            <input type="date" name="PublishedDate" id="PublishedDate" class="form-control" value="{{ book.published_date.strftime('%Y-%m-%d') }}" required />
                        </div>
                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-primary me-2">
                                <i class="bi bi-save"></i> Save Changes
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-secondary">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
{% endblock %}
